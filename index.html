    <script>
      // Fix for Web3 wallets (Rabby, MetaMask) monkey-patching window.fetch in iframe environments
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;

          // Attempt to redefine fetch on window with both getter and setter
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || originalFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return activeFetch || originalFetch;
                },
                set: function(fn) {
                  activeFetch = fn;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e2) {}
          }
        } catch (e) {}

        // Global safeguard against unhandled errors from wallet extensions attempting to write to read-only fetch
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            (event.message.indexOf('fetch of #<Window>') !== -1 ||
             event.message.indexOf("read only property 'fetch'") !== -1)
          ) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
